# Automation Center V1 最小 salt-api 能力；不要授予任意 runner、wheel 或模块通配符。
netapi_enable_clients:
  - local
  - local_async
  - runner
  - wheel

external_auth:
  file:
    ^filename: /etc/salt/api-users
    ^filetype: text
    ^hashtype: sha256
    # 使用独立账号，避免扩权或轮换已有 automation 调用方的凭据。
    automation-center:
      - test.ping
      - grains.item
      - cmd.run
      - cmd.run_all
      - cp.get_file
      - saltutil.kill_job
      - '@runner':
          - jobs.lookup_jid
          - jobs.list_jobs
      - '@wheel':
          - key.list_all
          - key.accept
          - key.reject

file_roots:
  base:
    # 维护包存储直接作为只读 Fileserver 根目录，避免再复制一份到 /srv/salt。
    - /var/lib/automation-center/packages

rest_cherrypy:
  # TLS 由同容器 Nginx 终止，salt-api 仅监听回环地址。
  host: 127.0.0.1
  port: 8000
  disable_ssl: true
  thread_pool: 10
