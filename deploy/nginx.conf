user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # request_id、总耗时和上游耗时可以直接区分浏览器等待、Nginx 等待和后端处理。
  log_format automation '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                        'request_time=$request_time upstream_time=$upstream_response_time request_id=$request_id '
                        '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout automation;
  sendfile on;
  client_max_body_size 10g;
  client_body_temp_path /var/lib/automation-center/temp/nginx 1 2;

  server {
    listen 8080;
    # 明文端口只做永久 HTTPS 跳转，不提供 API 或静态资源。
    return 308 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;
    # 证书以只读 Secret 挂载，Nginx 是容器内唯一 TLS 终止点。
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      # 上传由后端流式限额；请求缓冲会先落满大包，响应缓冲则会阻断 SSE 实时日志。
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
